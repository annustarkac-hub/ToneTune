name: Build TonoTune APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore release keystore (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.TONO_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            mkdir -p signing
            echo "$KEYSTORE_BASE64" | base64 -d > signing/tonotune-release.jks
            echo "TONO_KEYSTORE_PATH=signing/tonotune-release.jks" >> "$GITHUB_ENV"
            echo "Release keystore restored."
          else
            echo "No TONO_KEYSTORE_BASE64 secret: release APK will be signed with the debug key."
          fi

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build debug + release APKs
        env:
          TONO_KEYSTORE_PASSWORD: ${{ secrets.TONO_KEYSTORE_PASSWORD }}
          TONO_KEY_ALIAS: ${{ secrets.TONO_KEY_ALIAS }}
          TONO_KEY_PASSWORD: ${{ secrets.TONO_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleDebug assembleRelease lintRelease

      - name: Upload app-debug.apk
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload app-release.apk
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/app-release.apk

      - name: Upload UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: app/build/screenshots/
          if-no-files-found: ignore

      - name: Publish GitHub release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/app-release.apk
